/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(!a)return;
  if(t.tagName==='A'&&t.getAttribute('href'))return;e.preventDefault();e.stopPropagation();a(t,e);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&SH){closeSheet();return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('article[data-act]')){e.preventDefault();ACT[e.target.dataset.act]?.(e.target)}
  if(e.key==='Enter'&&e.target.id==='chk-new'){e.preventDefault();const v=e.target.value.trim();e.target.value='';if(v&&SH){SH.draft.checks=(SH.draft.checks||[]).concat({t:v,d:false});touch(true);drawSheet();setTimeout(()=>$('#chk-new')?.focus(),0)}}
  if(e.key==='Enter'&&e.target.id==='lk-url'){e.preventDefault();addLink()}
  if(e.key==='Enter'&&e.target.id==='q-in'){e.preventDefault();$('#quick-f').requestSubmit?$('#quick-f').requestSubmit():$('#quick-f').dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));return}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ttl-in')){e.preventDefault();e.target.blur()}
});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();const k=f.dataset.form;
  if(k==='qa'){const v=$('#qa-in').value.trim();if(!v)return;const it=addQuick(v);if(!it)return;$('#qa-in').value='';qaPreview();
    const c=get('cajones',it.cajon);toast(`Apuntado${c?' en '+c.name:''}${it.date?' para '+fmtD(it.date,1):''}.`,'Abrir',()=>openSheet('item','items',it.id,get('items',it.id)));}
  if(k==='quick'){const v=$('#q-in').value.trim();if(!v)return;const it=addQuick(v);if(!it)return;closeSheet();
    const c=get('cajones',it.cajon);toast(`Apuntado${c?' en '+c.name:''}${it.date?' para '+fmtD(it.date,1):''}.`,'Abrir',()=>openSheet('item','items',it.id,get('items',it.id)));}
  if(k==='cfg'){saveCfgForm();}
  if(k==='caj-add'){const inp=$('input',f),v=inp.value.trim();if(!v)return;addQuick(v,{cajon:f.dataset.id});inp.value='';}
  if(k==='goal-add'){const inp=$('input',f),v=inp.value.trim();if(!v)return;const g=S.goals[f.dataset.id];addQuick(v,{goal:f.dataset.id});inp.value='';}
  if(k==='sk-add'){const v=$('#sk-new').value.trim();if(!v)return;write('stickers',uid('stk'),{label:v,color:COLORS[arr('stickers').length%COLORS.length]});setTimeout(drawSheet,0);}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='qa-in'){qaPreview();return}
  if(t.id==='q-in'){qaPreview(t,$('#q-prev'));return}
  if(t.id==='f-lbl'&&SH&&SH.type==='link'){clearTimeout(t._t);const id=SH.id,idx=SH.draft.idx,v=t.value.trim();t._t=setTimeout(()=>{const c=S.cajones[id];if(!c||!c.links||!c.links[idx])return;const ls=c.links.map((x,i)=>i===idx?Object.assign({},x,{label:v}):x);write('cajones',id,Object.assign({},c,{links:ls}))},500);return}
  if(!SH||!$('#sheet').contains(t))return;
  if(t.dataset.f){const f=t.dataset.f;let v=t.type==='checkbox'?t.checked:t.value;if(f==='stage')v=Number(v);if((f==='date'||f==='end'||f==='due'||f==='goal'||f==='song'||f==='gig'||f==='cajon')&&!v)v=null;
    SH.draft[f]=v;if(t.classList.contains('ttl-in')){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
    if(SH.type==='release'){drawSheet();return}
    touch(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='date');
    if(f==='period'&&SH.isNew){SH.draft.due=periodDue(v);drawSheet()}return}
  if(t.dataset.chk!=null){SH.draft.checks[Number(t.dataset.chk)].d=t.checked;touch(true);drawSheet();return}
  if(t.dataset.chkt!=null){SH.draft.checks[Number(t.dataset.chkt)].t=t.value;touch();return}
  if(t.dataset.sk){const s=S.stickers[t.dataset.sk];clearTimeout(t._t);t._t=setTimeout(()=>{if(s&&t.value.trim())write('stickers',t.dataset.sk,Object.assign({},s,{label:t.value.trim()}))},600);return}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='chk-new'&&SH){const v=t.value.trim();t.value='';if(v){SH.draft.checks=(SH.draft.checks||[]).concat({t:v,d:false});touch(true);setTimeout(()=>{const nb=$('#chk-new');const box=nb&&nb.closest('.checks');if(SH&&box&&!nb.value)box.outerHTML=checksH(SH.draft.checks)},400)}return}
  if(t.id==='lk-url'&&SH&&t.value.trim()){addLink(true);return}
  if(t.closest&&t.closest('form.add-in')&&t.value.trim()){const f=t.closest('form');f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));return}
  if(t.id==='f-cnx'&&t.value&&SH){SH.draft.links=(SH.draft.links||[]).concat({to:t.value,label:''});touch(true);drawSheet();return}
  if(t.id==='f-addsong'&&t.value&&SH){SH.draft.setlist=(SH.draft.setlist||[]).concat(t.value);touch(true);drawSheet();return}
  if(t.id==='f-up'&&SH){await uploadFiles(t);return}
  if(t.id==='imp'){await importJson(t);return}
});
function upTypeOld(f){const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(/^(png|gif|webp)$/.test(ext))return['image/'+ext,'image'];if(/^jpe?g$/.test(ext))return['image/jpeg','image'];if(ext==='svg')return['image/svg+xml','image'];
  if(ext==='pdf')return['application/pdf','pdf'];if(ext==='webm')return['video/webm',f.type.startsWith('audio')?'audio':'video'];
  if(/^(mp4|mov|m4v)$/.test(ext))return['video/mp4','video'];
  if(/^(m4a|aac|mp3|wav|aif|aiff|flac)$/.test(ext))return['video/mp4','audio'];if(/^(ogg|opus|oga)$/.test(ext))return['video/webm','audio'];return null;}
/* arrastrar y soltar */
let dragId=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(!t||document.body.classList.contains('ro'))return;dragId=t.dataset.drag;t.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(err){}});
document.addEventListener('dragend',e=>{dragId=null;$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{if(!dragId)return;const z=e.target.closest('[data-drop]');if(!z)return;e.preventDefault();$$('.over').forEach(x=>{if(x!==z)x.classList.remove('over')});z.classList.add('over')});
document.addEventListener('drop',e=>{if(!dragId)return;const z=e.target.closest('[data-drop]');if(!z)return;e.preventDefault();if(dragId.includes('/')&&z.dataset.drop==='day'){const[col,id]=dragId.split('/'),f=col==='goals'?'due':'date',d0=S[col]&&S[col][id];dragId=null;
    if(d0&&d0[f]!==z.dataset.id){const old=d0[f]||null;write(col,id,Object.assign({},d0,{[f]:z.dataset.id}));toast(`${d0.title||d0.name} → ${fmtD(z.dataset.id,1)}`,'Deshacer',()=>{const h=S[col][id];if(h)write(col,id,Object.assign({},h,{[f]:old}))})}return}
  const it=S.items[dragId];if(!it)return;
  if(z.dataset.drop==='caj'){const c=z.dataset.id==='_none'?null:z.dataset.id;if(it.cajon!==c||it.free)write('items',dragId,Object.assign({},it,{cajon:c,free:null}))}
  if(z.dataset.drop==='day'){const nd=z.dataset.id;if(it.date!==nd){const o=Object.assign({},it,{date:nd});if(it.end&&it.date)o.end=iso(addD(pd(nd),diff(pd(it.date),pd(it.end))));write('items',dragId,o);toast(`«${it.title}» movida al ${fmtD(nd,1)}.`)}}
  dragId=null;});
window.addEventListener('hashchange',()=>{if(SH)closeSheet();render();window.scrollTo(0,0)});
/* aviso */
let toT=0;function toast(msg,label,fn){const t=$('#toast'),b=$('#toast-btn');$('#toast-msg').textContent=msg;
  if(label){b.hidden=false;b.textContent=label;b.onclick=()=>{fn();t.classList.remove('show')}}else b.hidden=true;
  t.classList.add('show');clearTimeout(toT);toT=setTimeout(()=>t.classList.remove('show'),5200);}

boot();
})();
</script>
